services:

  db:
    image: postgres:15-alpine
    container_name: legaltech_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: legaltech_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legaltech_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legaltech_backend
    restart: unless-stopped
    environment:
      SECRET_KEY: django-dev-secret-key-change-this
      DEBUG: "True"
      DB_NAME: legaltech_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - legaltech_network
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL...' &&
        while ! nc -z db 5432; do sleep 1; done &&
        echo 'PostgreSQL ready!' &&
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "

volumes:
  postgres_data:
    driver: local
    name: legaltech_postgres_data
  media_data:
    driver: local
    name: legaltech_media_data

networks:
  legaltech_network:
    driver: bridge
    name: legaltech_network