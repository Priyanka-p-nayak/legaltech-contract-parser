# ============================================================
# NGINX VIRTUAL HOST CONFIGURATION
# LegalTech Backend Reverse Proxy
# ============================================================

# Upstream — points to our Django/gunicorn backend
upstream legaltech_backend {
    # 'backend' = Docker service name
    # 8000 = port gunicorn listens on
    server backend:8000;
}

server {
    # Listen on port 80 (HTTP)
    listen 80;

    # Server name — use domain or localhost
    server_name localhost;

    # ── Static Files ──────────────────────────────────────
    # Nginx serves static files directly (faster than Django)
    location /static/ {
        alias /app/staticfiles/;

        # Cache static files for 30 days
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media Files ───────────────────────────────────────
    # Nginx serves uploaded PDFs directly
    location /media/ {
        alias /app/media/;

        # Cache media files for 7 days
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── API Requests ──────────────────────────────────────
    # Forward all other requests to Django
    location / {
        proxy_pass http://legaltech_backend;

        # Pass client information to Django
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings for large responses
        proxy_buffer_size       4k;
        proxy_buffers           4 32k;
        proxy_busy_buffers_size 64k;
    }

    # ── Health Check ──────────────────────────────────────
    # Nginx health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "nginx is healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Error Pages ───────────────────────────────────────
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}